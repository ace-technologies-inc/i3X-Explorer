name: Build & Sign Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build Vite
        run: npm run build:vite

      # Signing happens inside electron-builder: electron-builder.json points
      # win.signtoolOptions.sign at scripts/winSign.cjs, which signs every file with signtool
      # + the Azure Trusted Signing dlib, so the app exe is signed BEFORE it is packed into
      # the NSIS installer and portable exe, and the uninstaller is signed too. Signing the
      # finished installers afterwards left the installed "i3X Explorer.exe" unsigned, which
      # Windows 11 Smart App Control blocks. prepare-win-signing.ps1 finds signtool, fetches
      # the dlib and tells the hook where they are.
      - name: Build and sign Windows installers
        shell: pwsh
        run: |
          . ./scripts/prepare-win-signing.ps1
          npx electron-builder --win --publish never
          $code = $LASTEXITCODE
          Remove-Item $env:I3X_SIGN_METADATA -ErrorAction SilentlyContinue
          exit $code
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_TRUSTED_SIGNING_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}

      # The installers, plus the app exe in each *-unpacked folder (the same file that was
      # packed into the installers), must all carry a valid, timestamped signature.
      - name: Verify signatures
        shell: pwsh
        run: |
          $files = @(Get-ChildItem release -Filter '*.exe' -Recurse |
            Where-Object { $_.Directory.Name -notlike '*-unpacked' -or $_.Name -eq 'i3X Explorer.exe' })
          $apps = @($files | Where-Object { $_.Name -eq 'i3X Explorer.exe' })
          if ($apps.Count -eq 0) { throw "No unpacked 'i3X Explorer.exe' found to verify" }
          $bad = 0
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature -FilePath $f.FullName
            if ($sig.Status -ne 'Valid' -or -not $sig.TimeStamperCertificate) {
              Write-Host "::error::$($f.FullName): $($sig.Status) $($sig.StatusMessage)"
              $bad++
            } else {
              Write-Host "OK  $($f.FullName)  ($($sig.SignerCertificate.Subject))"
            }
          }
          if ($bad -gt 0) { throw "$bad file(s) not validly signed" }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ github.ref_name }}
          path: release/**/*.exe
          retention-days: 30
